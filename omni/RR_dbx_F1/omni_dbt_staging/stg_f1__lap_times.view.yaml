schema_label: ""
#This description was pulled from dbt.
description: One record per driver per lap, from 1996 onwards.

schema: omni_dbt_staging
table_name: stg_f1__lap_times

dimensions:
  lap_number: {}
  track_position: {}
  lap_time_display: {}
  lap_time_milliseconds: {}

  race_id:
    format: ID

  driver_id:
    format: ID

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_f1__lap_times
  target_schema: prod
  description: One record per driver per lap, from 1996 onwards.
  config:
    schema: staging
    materialized: view
  code: |-
    with source as (

        select * from {{ source('f1', 'lap_times') }}

    ),

    deduped as (

        select
            raceId as race_id,
            driverId as driver_id,
            lap as lap_number,
            position as track_position,
            time as lap_time_display,
            milliseconds as lap_time_milliseconds

        from source
        qualify row_number() over (
            partition by raceId, driverId, lap
            order by milliseconds asc, position asc
        ) = 1

    )

    select * from deduped
  referenced_by: [ fct_lap_times ]
