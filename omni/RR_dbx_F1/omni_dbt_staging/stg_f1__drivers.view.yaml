#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_f1__drivers
  target_schema: prod
  description: One record per driver, with a derived full_name.
  config:
    schema: staging
    materialized: view
  code: |-
    with source as (

        select * from {{ source('f1', 'drivers') }}

    ),

    renamed as (

        select
            driverId as driver_id,
            driverRef as driver_ref,
            cast({{ ergast_null('number') }} as int) as driver_number,
            {{ ergast_null('code') }} as driver_code,
            forename,
            surname,
            forename || ' ' || surname as full_name,
            dob as date_of_birth,
            nationality,
            url as wikipedia_url

        from source

    )

    select * from renamed
  referenced_by: [ dim_drivers ]
