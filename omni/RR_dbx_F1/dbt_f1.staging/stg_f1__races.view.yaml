#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_f1__races
  target_schema: prod
  description: One record per Grand Prix weekend.
  config:
    schema: staging
    materialized: view
  code: |-
    with source as (

        select * from {{ source('f1', 'races') }}

    ),

    renamed as (

        select
            raceId as race_id,
            year as season_year,
            round,
            circuitId as circuit_id,
            name as race_name,
            date as race_date,
            {{ ergast_null('time') }} as race_start_time_utc,
            url as wikipedia_url,
            cast({{ ergast_null('fp1_date') }} as date) as fp1_date,
            {{ ergast_null('fp1_time') }} as fp1_time_utc,
            cast({{ ergast_null('fp2_date') }} as date) as fp2_date,
            {{ ergast_null('fp2_time') }} as fp2_time_utc,
            cast({{ ergast_null('fp3_date') }} as date) as fp3_date,
            {{ ergast_null('fp3_time') }} as fp3_time_utc,
            cast({{ ergast_null('quali_date') }} as date) as qualifying_date,
            {{ ergast_null('quali_time') }} as qualifying_time_utc,
            cast({{ ergast_null('sprint_date') }} as date) as sprint_date,
            {{ ergast_null('sprint_time') }} as sprint_time_utc

        from source

    )

    select * from renamed
  referenced_by: [ dim_races ]
