description: One record per pit stop, from 2011 onwards. pit_stop_local_time is
  local time of day at the circuit.

catalog: dbt_f1
schema: staging
table_name: stg_f1__pit_stops

dimensions:
  stop_number: {}
  lap_number: {}
  pit_stop_local_time: {}
  duration_display: {}
  pit_stop_milliseconds: {}

  race_id:
    format: ID

  driver_id:
    format: ID

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_f1__pit_stops
  target_schema: prod
  description: One record per pit stop, from 2011 onwards. pit_stop_local_time is
    local time of day at the circuit.
  config:
    schema: staging
    materialized: view
  code: |-
    with source as (

        select * from {{ source('f1', 'pit_stops') }}

    ),

    renamed as (

        select
            raceId as race_id,
            driverId as driver_id,
            stop as stop_number,
            lap as lap_number,
            date_format(time, 'HH:mm:ss') as pit_stop_local_time,
            duration as duration_display,
            cast({{ ergast_null('milliseconds') }} as bigint) as pit_stop_milliseconds

        from source

    )

    select * from renamed
  referenced_by: [ fct_pit_stops ]
