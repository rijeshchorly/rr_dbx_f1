# Reference this view as dbt_f1_dev_staging__stg_f1__results
catalog: dbt_f1
schema: dev_staging
table_name: stg_f1__results

dimensions:
  driver_number: {}
  grid_position: {}
  finish_position: {}
  position_text: {}
  position_order: {}
  points: {}
  laps_completed: {}
  finish_time_display: {}
  finish_time_milliseconds: {}
  fastest_lap_number: {}
  fastest_lap_rank: {}
  fastest_lap_time: {}
  fastest_lap_speed_kph: {}

  result_id:
    format: ID

  race_id:
    format: ID

  driver_id:
    format: ID

  constructor_id:
    format: ID

  status_id:
    format: ID

measures:
  count:
    aggregate_type: count
